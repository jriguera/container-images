version: "3.9"
services:
  amule:
    build:
      context: .
    image: amule
    restart: unless-stopped
    networks:
      - amule
    ports:
      - "4711:4711"      # Web interface (amuleweb, legacy)
      - "4713:4713"      # Web interface + REST API (amuleapi, new)
      - "4712:4712"      # External Connect
      - "4662:4662/tcp"  # eD2k TCP
      - "4672:4672/udp"  # eD2k UDP
    volumes:
      - data:/data
      - ./config:/config
    environment:
      # Network Ports
      - AMULE_PORT=4662
      - AMULE_UDPPORT=4672
      - AMULE_UDPENABLE=true
      # Authentication
      - AMULE_PASSWORD=mysecretpassword
      # AMULE_PASSWORD_HASH=6e0600b99a12d7e70687f0937a152fd5  # Pre-computed MD5 hash
      # External Connect
      - AMULE_EC_ADDRESS=0.0.0.0
      - AMULE_EC_ECPORT=4712
      # Web Server (amuleweb, legacy)
      - PORT_WEB=4711
      - AMULE_WEBSERVER_PORT=4711
      - AMULE_WEBSERVER_TEMPLATE=bootstrap
      - ENABLE_AMULEWEB=true
      # Web UI + REST API (amuleapi, new)
      - PORT_API=4713
      - ENABLE_AMULEAPI=true
      # Behavior
      - GENERATE_CONFIG=true
      - RECURSIVE_SHARE=true
      - FIX_KAD_GRAPH=true
      - DOWNLOAD_RESOURCES=true
      # Optional
      - AMULE_YOURHOSTNAME=my-amule-server

volumes:
  data:
    driver: local

networks:
  amule:
    name: amule
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1